[project]
name = "xchat-bot-python"
version = "0.1.0"
description = "Minimal X Chat bot example using XDKs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "xdk >= 0.6.0",
  "chat-xdk",
  "xai-sdk",
]

[project.scripts]
xchat-bot-login = "xchat_bot_python.login:main"
xchat-bot-unlock = "xchat_bot_python.unlock:main"
xchat-bot-run = "xchat_bot_python.bot:main"
xchat-bot-run-grok = "xchat_bot_python.bot_grok:main"
xchat-bot-run-react = "xchat_bot_python.bot_react:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xchat_bot_python"]

[tool.uv.sources]
chat-xdk = { path = "../chat-xdk/crates/pyo3", editable = true }

